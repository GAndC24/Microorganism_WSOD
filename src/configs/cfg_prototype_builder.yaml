RUNTIME:
  SEED: 42
  DEVICE: "cuda"  # 'cuda' or 'cpu'

DATA:
  DATA_ROOT: "data/processed/Urinary Sediment Dataset"
  BATCH_SIZE: 8
  IMG_SIZE: 1000
  NUM_CLASSES: 7

MODEL:
  EMBED_DIM: 512
  HIDDEN_DIM: 4096  # (512, 1024, 2048, 4096)
  LAYER_INDICES: [8, 22, 29]  # [low, mid, high]
  PATCH_SIZE: 3   # 2 or 3
  # for GMM in Morphological Prototype Generator
  COMPONENTS_RANGE: [2, 3, 4]
  MAX_ITER: 20
  # for RoI Align
  ROI_OUT_SIZE_MID: 21   # 14 or 21, should be divisible by PATCH_SIZE
  SAMPLING_RATIO: 2